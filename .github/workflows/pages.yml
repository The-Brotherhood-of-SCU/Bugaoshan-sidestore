name: Pages

on:
  push:
    branches: [main]
    paths:
      - "preview.json"
      - "stable.json"
      - "preview-mirror.json"
      - "stable-mirror.json"
      - "site/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    # 兜底：机器人用 GITHUB_TOKEN 提交的 JSON 不会触发 push 事件，
    # sync 里的 Pages 部署若失败，靠这条每日任务收敛。
    - cron: "23 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy source mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp preview.json stable.json preview-mirror.json stable-mirror.json _site/
          cp -r site/. _site/
          cp -r assets _site/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before Pages retry
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "首次 Pages 部署失败（常见于 artifact/Pages API 瞬时故障），15 秒后重试"
          sleep 15

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
