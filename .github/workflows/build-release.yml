name: Build and publish IPA

# 由 sync.yml 调用：从上游 tag 源码构建未签名 IPA，发布到本仓库 Release，
# 再把版本写回对应渠道的源 JSON 并提交。

on:
  workflow_call:
    inputs:
      plan:
        description: "scripts/plan.py 输出的单渠道计划（JSON 字符串）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-${{ fromJSON(inputs.plan).channel }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ fromJSON(inputs.plan).channel }} ${{ fromJSON(inputs.plan).version }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      # 注意：不要用 CHANNEL / VERSION 这类通用变量名，subosito/flutter-action
      # 内部也读 CHANNEL/VERSION 环境变量，会覆盖它自己的 setup 参数。
      SRC_MODE: ${{ fromJSON(inputs.plan).mode }}
      SRC_CHANNEL: ${{ fromJSON(inputs.plan).channel }}
      SRC_TAG: ${{ fromJSON(inputs.plan).tag }}
      SRC_VERSION: ${{ fromJSON(inputs.plan).version }}
      SRC_BUILD_NAME: ${{ fromJSON(inputs.plan).build_name }}
      SRC_BUILD_NUMBER: ${{ fromJSON(inputs.plan).build_number }}
      UPSTREAM_REPO: ${{ fromJSON(inputs.plan).upstream_repo }}
      PLAN_ASSET_URL: ${{ fromJSON(inputs.plan).asset_url }}
      PLAN_ASSET_SIZE: ${{ fromJSON(inputs.plan).asset_size }}
      PLAN_ASSET_DATE: ${{ fromJSON(inputs.plan).asset_date }}
      PLAN_ASSET_SHA256: ${{ fromJSON(inputs.plan).asset_sha256 }}
      UPSTREAM_DIR: ${{ github.workspace }}/.work/upstream
      IPA_DIR: ${{ github.workspace }}/.work/ipa
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      COCOAPODS_DISABLE_STATS: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          chosen=""
          for candidate in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.app \
            /Applications/Xcode_26.0.app; do
            if [ -d "$candidate/Contents/Developer" ]; then
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            chosen="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$chosen" ]; then
            echo "::error::找不到可用的 Xcode"
            exit 1
          fi
          echo "使用 $chosen"
          sudo xcode-select --switch "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Clone upstream at tag
        if: fromJSON(inputs.plan).mode == 'build'
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          rm -rf "$UPSTREAM_DIR"
          mkdir -p "$(dirname "$UPSTREAM_DIR")"
          git clone --depth 1 --branch "$SRC_TAG" "https://github.com/$UPSTREAM_REPO.git" "$UPSTREAM_DIR"
          echo "UPSTREAM_COMMIT=$(git -C "$UPSTREAM_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply widget bridge patch
        if: fromJSON(inputs.plan).mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/patches/widget-bridge.patch"
          cd "$UPSTREAM_DIR"
          # 小组件桥接补丁：App 把 DB 快照写进 Keychain，Widget 扩展从 Keychain 还原，
          # 用于无法使用 App Group 的侧载环境。上游改动这两个文件时补丁可能失配：
          # 先尝试 fuzz；仍失败则回滚并让整个 workflow 失败（触发 Actions 失败通知，
          # 便于及时发现并更新补丁），绝不发布没有桥接的包。
          if git apply --verbose "$PATCH" 2>/dev/null; then
            echo "WIDGET_BRIDGE=applied" >> "$GITHUB_ENV"
            echo "widget bridge patch：git apply 成功"
          else
            git checkout -- . && git clean -fd
            if patch -p1 -F3 --dry-run < "$PATCH" >/dev/null 2>&1 && patch -p1 -F3 < "$PATCH" >/dev/null 2>&1; then
              echo "WIDGET_BRIDGE=applied-fuzzy" >> "$GITHUB_ENV"
              echo "widget bridge patch：fuzz 应用成功（上游有轻微改动）"
            else
              git checkout -- . && git clean -fd
              echo "::error::widget bridge 补丁失配：git apply 与 fuzz 均失败。请更新 patches/widget-bridge.patch 后重跑；本次不发布任何产物。"
              exit 1
            fi
          fi

      - name: Detect Flutter version
        id: flutter
        if: fromJSON(inputs.plan).mode == 'build'
        shell: bash
        # 从被构建的 tag 源码里取上游 pin 的 Flutter 版本（setup action → workflows →
        # .metadata revision），仓库变量 FLUTTER_VERSION 可临时覆盖。默认不联网。
        run: |
          python3 scripts/detect_flutter_version.py \
            --upstream-dir "$UPSTREAM_DIR" \
            --override "${{ vars.FLUTTER_VERSION }}" \
            --fail-on-default

      - name: Set up Flutter
        if: fromJSON(inputs.plan).mode == 'build'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        if: fromJSON(inputs.plan).mode == 'build'
        shell: bash
        working-directory: ${{ github.workspace }}/.work/upstream
        run: python3 .github/scripts/pub_get_with_fallback.py

      - name: Generate code and localizations
        if: fromJSON(inputs.plan).mode == 'build'
        shell: bash
        working-directory: ${{ github.workspace }}/.work/upstream
        run: |
          set -uo pipefail
          # 与上游 .github/actions/setup 保持一致：代码生成失败不阻断，
          # 真正的编译错误会在 flutter build 阶段暴露。
          dart run build_runner build --delete-conflicting-outputs || true
          flutter gen-l10n

      - name: Build unsigned iOS app
        if: fromJSON(inputs.plan).mode == 'build'
        shell: bash
        working-directory: ${{ github.workspace }}/.work/upstream
        run: |
          set -euo pipefail
          META="$(VERSION="$SRC_TAG" GITHUB_OUTPUT= python3 .github/scripts/git_meta.py)"
          GIT_TAG="$(printf '%s\n' "$META" | sed -n 's/^GIT_TAG=//p' | head -n 1)"
          GIT_COMMIT="$(printf '%s\n' "$META" | sed -n 's/^GIT_COMMIT=//p' | head -n 1)"
          GIT_COMMIT_DATE="$(printf '%s\n' "$META" | sed -n 's/^GIT_COMMIT_DATE=//p' | head -n 1)"
          echo "GIT_TAG=$GIT_TAG"
          echo "GIT_COMMIT=$GIT_COMMIT"
          echo "GIT_COMMIT_DATE=$GIT_COMMIT_DATE"
          # 未签名构建：SideStore / AltStore 安装时会用用户自己的证书重签名。
          flutter build ios --release --no-codesign \
            --build-name "$SRC_BUILD_NAME" \
            --build-number "$SRC_BUILD_NUMBER" \
            --dart-define=GIT_TAG="$GIT_TAG" \
            --dart-define=GIT_COMMIT="$GIT_COMMIT" \
            --dart-define=GIT_COMMIT_DATE="$GIT_COMMIT_DATE"

      - name: Package IPA
        if: fromJSON(inputs.plan).mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$IPA_DIR"
          python3 scripts/package_ipa.py \
            --app "$UPSTREAM_DIR/build/ios/iphoneos/Runner.app" \
            --out "$IPA_DIR/Bugaoshan-$SRC_VERSION.ipa" \
            --expect-bundle-id io.github.thebrotherhoodofscu.bugaoshan.ios \
            --set-short-version "$SRC_BUILD_NAME" \
            --expect-short-version "$SRC_BUILD_NAME" \
            --expect-build-number "$SRC_BUILD_NUMBER" \
            | tee "$IPA_DIR/metadata.json"
          ls -lh "$IPA_DIR"

      - name: Upload IPA artifact
        if: fromJSON(inputs.plan).mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ fromJSON(inputs.plan).version }}
          path: ${{ github.workspace }}/.work/ipa/Bugaoshan-${{ fromJSON(inputs.plan).version }}.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "由 GitHub Actions 从上游 [\`$UPSTREAM_REPO\`](https://github.com/$UPSTREAM_REPO) 的 tag \`$SRC_TAG\` 源码构建的**未签名 IPA**，安装时由 SideStore / AltStore 使用你自己的证书重新签名。"
            echo
            echo "- 安装：把本仓库的源添加到 SideStore / AltStore，或下载下面的 IPA 用你自己的证书重签名。"
            echo "- 版本注入：\`CFBundleShortVersionString=$SRC_BUILD_NAME\`、\`CFBundleVersion=$SRC_BUILD_NUMBER\`（与上游 CI 的版本注入规则一致）。"
            echo "- 构建工具链：Flutter \`${FLUTTER_VERSION:-unknown}\`（来源 \`${FLUTTER_SOURCE:-unknown}\`）。"
            echo "- 小组件：已内置 Keychain 桥接补丁。安装时请选 **Keep App Extensions (Use Main Profile)**，装完先打开一次 App 让快照写入，再添加小组件。"
            echo
          } > "$NOTES"
          if ! gh api "repos/$UPSTREAM_REPO/releases/tags/$SRC_TAG" --jq '.body' >> "$NOTES" 2>/dev/null; then
            echo "上游没有该 tag 的 Release 记录（tag 存在但没有发布 Release 或已取消），对应上游提交：" >> "$NOTES"
            echo >> "$NOTES"
            if [ -n "${UPSTREAM_COMMIT:-}" ]; then
              echo "[\`$UPSTREAM_COMMIT\`](https://github.com/$UPSTREAM_REPO/commit/$UPSTREAM_COMMIT)" >> "$NOTES"
            else
              echo "[$UPSTREAM_REPO@$SRC_TAG](https://github.com/$UPSTREAM_REPO/tree/$SRC_TAG)" >> "$NOTES"
            fi
          fi

      - name: Publish GitHub release
        if: fromJSON(inputs.plan).mode == 'build'
        shell: bash
        run: |
          set -euo pipefail
          IPA="$IPA_DIR/Bugaoshan-$SRC_VERSION.ipa"
          TITLE="不高山上 $SRC_VERSION"
          NOTES="$RUNNER_TEMP/release-notes.md"
          exists=0
          if gh release view "$SRC_TAG" >/dev/null 2>&1; then exists=1; fi
          if [ "$exists" = "1" ]; then
            gh release upload "$SRC_TAG" "$IPA" --clobber
            if [ "$SRC_CHANNEL" = "preview" ]; then
              gh release edit "$SRC_TAG" --title "$TITLE" --notes-file "$NOTES" --prerelease
            else
              gh release edit "$SRC_TAG" --title "$TITLE" --notes-file "$NOTES"
            fi
          else
            if [ "$SRC_CHANNEL" = "preview" ]; then
              gh release create "$SRC_TAG" "$IPA" --title "$TITLE" --notes-file "$NOTES" --prerelease
            else
              gh release create "$SRC_TAG" "$IPA" --title "$TITLE" --notes-file "$NOTES"
            fi
          fi

      - name: Update source JSON
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SRC_MODE" = "reuse" ]; then
            SIZE="$PLAN_ASSET_SIZE"
            URL="$PLAN_ASSET_URL"
            DATE="$PLAN_ASSET_DATE"
            SHA256="$PLAN_ASSET_SHA256"
            if [ -z "$URL" ] || [ -z "$SIZE" ]; then
              echo "::error::reuse 模式缺少已有 Release 资产信息"
              exit 1
            fi
          else
            SIZE="$(stat -f%z "$IPA_DIR/Bugaoshan-$SRC_VERSION.ipa")"
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$SRC_TAG/Bugaoshan-$SRC_VERSION.ipa"
            DATE="$(date -u +%F)"
            SHA256="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$IPA_DIR/metadata.json")"
          fi
          if [ -z "$DATE" ]; then DATE="$(date -u +%F)"; fi
          # SideStore 默认会校验 IPA 的 SHA-256；构建模式下由 package_ipa.py 计算，
          # reuse 模式用 GitHub Release 资产的 digest。
          python3 scripts/update_source.py \
            --channel "$SRC_CHANNEL" \
            --tag "$SRC_TAG" \
            --size "$SIZE" \
            --download-url "$URL" \
            --date "$DATE" \
            --sha256 "${SHA256:-}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Generate mirror source JSON
        shell: bash
        run: python3 scripts/make_mirror.py --channel "$SRC_CHANNEL"

      - name: Validate source JSON
        shell: bash
        # 镜像站（第三方代理）抖动只告警、不阻断发布；直连地址与哈希必须通过。
        run: python3 scripts/validate_sources.py --channel "$SRC_CHANNEL" --check-urls --check-hashes

      - name: Commit source JSON
        shell: bash
        run: |
          set -euo pipefail
          git add preview.json stable.json preview-mirror.json stable-mirror.json
          if git diff --cached --quiet; then
            echo "源 JSON 没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(source): 同步 $SRC_CHANNEL $SRC_VERSION"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "已推送源 JSON"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::推送源 JSON 失败"
          exit 1

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 不高山上 $SRC_CHANNEL $SRC_VERSION"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 动作 | \`$SRC_MODE\` |"
            echo "| 上游 tag | \`$SRC_TAG\` |"
            echo "| 版本注入 | \`$SRC_BUILD_NAME ($SRC_BUILD_NUMBER)\` |"
            echo "| 小组件桥接 | \`${WIDGET_BRIDGE:-unknown}\` |"
            echo "| Flutter | \`${FLUTTER_VERSION:-unknown}\`（${FLUTTER_SOURCE:-unknown}） |"
            echo "| Release | https://github.com/$GITHUB_REPOSITORY/releases/tag/$SRC_TAG |"
            if [ -f "$IPA_DIR/metadata.json" ]; then
              echo "| IPA 大小 | $(cat "$IPA_DIR/metadata.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["size"])') 字节 |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
