name: Validate

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "*.json"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Scripts and source JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate source JSON
        run: python3 scripts/validate_sources.py

      - name: Check scripts compile
        run: python3 -m compileall -q scripts tests
